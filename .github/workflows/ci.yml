name: MoonBit core
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Check, build and test
        run: |
          moon version --all
          moon check --deny-warn --target all
          moon build --target all
          moon test --deny-warn --target all
          moon fmt --check
          moon info
          git diff --exit-code
      - name: Exercise public API examples
        run: python3 scripts/verify_examples.py
      - name: Exercise the standalone bill archive client
        run: python3 integrations/ledger/test_ledger.py
      - name: Reproduce the CSV billing MVP
        run: python3 scripts/verify_mvp.py _build/mvp-demo
      - name: Inspect and exercise the distributable source package
        run: python3 scripts/verify_package.py
      - name: Save inspectable MVP evidence
        uses: actions/upload-artifact@v4
        with:
          name: mvp-example-bills
          path: _build/mvp-demo/
